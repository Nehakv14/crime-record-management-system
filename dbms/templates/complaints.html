<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Complaints</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin-left: 10%;
            margin-right: 10%;
            padding: 20px;
            background: #f8f8f8;
        }

        h2 {
            text-align: center;
            color: #6f42c1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
            box-shadow: 0px 0px 8px rgba(0,0,0,0.1);
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #6f42c1;
            color: white;
        }

        tr:hover {
            background: #f1f1f1;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #6f42c1;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h2>User Complaints</h2>
    <table>
        <tr>
            <th>ID</th>
            <th>User Name</th>
            <th>Title</th>
            <th>Complaint</th>
            <th>Status</th>
            <th>Timestamp</th>
            <th>Location</th>
        </tr>
        {% for complaint in complaints %}
        <tr>
            <td>{{ complaint.id }}</td>
            <td>{{ complaint.user.name }}</td>  <!-- Display the name of the user who made the complaint -->
            <td>{{ complaint.title }}</td>
            <td>{{ complaint.description[:50] }}...</td>
            <td>{{ complaint.status }}</td>
            <td>{{ complaint.timestamp }}</td>
            <td>{{ complaint.location }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
