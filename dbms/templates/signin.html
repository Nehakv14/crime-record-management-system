<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crime Record System</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4c15b3, #6f42c1);
            color: white;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-box {
            background: white;
            width: 350px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            color: black;
        }

        .tab-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .tab {
            width: 50%;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .active-tab {
            background: linear-gradient(to right, #4c15b3, #6f42c1);
            color: white;
            border-radius: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #6f42c1;
            border-radius: 5px;
            background-color: #f8f8f8;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(to right, #4c15b3, #6f42c1);
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn:hover {
            opacity: 0.8;
        }

        #registerForm {
            display: none;
        }
    </style>

    <script>
        function showForm(formType) {
            if (formType === 'login') {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('loginTab').classList.add('active-tab');
                document.getElementById('registerTab').classList.remove('active-tab');
            } else {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('registerTab').classList.add('active-tab');
                document.getElementById('loginTab').classList.remove('active-tab');
            }
        }
    </script>
</head>
<body>

    <div class="form-box">
        <h2>Login Form</h2>

        <!-- Tabs -->
        <div class="tab-container">
            <div id="loginTab" class="tab active-tab" onclick="showForm('login')">Login</div>
            <div id="registerTab" class="tab" onclick="showForm('register')">Signup</div>
        </div>

        <!-- Login Form -->
        <form id="loginForm" method="POST">
            <input type="hidden" name="form_type" value="login">
            <input type="text" name="login_id" placeholder="ID" required>
            <input type="password" name="login_password" placeholder="Password" required>
            <select name="login_role" required>
                <option value="">Select Role</option>
                <option value="user">User</option>
                <option value="police">Police</option>
            </select>
            <button type="submit" class="btn">Login</button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" method="POST">
            <input type="hidden" name="form_type" value="register">
            <input type="text" name="id" placeholder="ID" required>
            <input type="text" name="name" placeholder="Name" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            <select name="role" required>
                <option value="">Select Role</option>
                <option value="user">User</option>
                <option value="police">Police</option>
            </select>
            <button type="submit" class="btn">Signup</button>
        </form>
    </div>

</body>
</html>
